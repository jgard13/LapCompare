<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/styles/detalles.css">
    <title>LapCompare</title>
</head>
<body>
    <header>
        <nav class="navbar LapCompare-titulo p-0">
            <div class="container-fluid p-3 d-flex justify-content-between align-items-center">
                <h1>LAP-COMPARE</h1>
                <div>
                    <button id="BtnIniciarSe" class="btnIniciar-Ses d-flex"> Iniciar Sesion </button>
                </div>
            </div>
        </nav>
    </header>

    <main class="container mt-4">
        
        <div class="mb-4">
            <a href="#" class="text-decoration-none" style="color: #A076F9; font-size: 14px;">Volver al Catálogo</a>
        </div>

        <div class="row mb-5">
            
            <div class="col-md-4 mb-4">
                <div style="background-color: #E6E6E6; border-radius: 10px; height: 280px; position: relative; display: flex; align-items: center; justify-content: center;">
                    <img id="imagenPrincipal" src="" alt="Laptop" class="img-fluid" style="max-height: 100%; object-fit: contain;" />
                    
                    <div style="position: absolute; top: 15px; right: 15px; background: #FFFFFF; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                        <i class="bi bi-heart text-secondary" style="font-size: 14px;"></i>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-4 d-flex flex-column">
                <h2 id="nombreLaptop" class="fw-bold" style="font-size: 22px; color: #000000;">Cargando...</h2>
                <p id="precioLaptop" class="fw-bold mb-3" style="color: #A076F9; font-size: 20px;">Cargando...</p>
                
                <div class="d-flex flex-column gap-2 mb-4" style="max-width: 220px;">
                    <button class="btn" style="background: #FFFFFF; border: 1px solid #000000; font-size: 12px; padding: 6px; border-radius: 4px;">Agregar a Comparación +</button>
                    <button class="btn" style="background: #2D2D2D; color: #FFFFFF; border: none; font-size: 12px; padding: 6px; border-radius: 4px;">Ir al sitio de compra</button>
                    </div>

                <div class="p-3" style="background-color: #F5F5F5; border-radius: 8px; max-width: 220px;">
                    <p class="fw-bold mb-1" style="font-size: 11px; color: #000000;">Ideal para:</p>
                    <ul class="list-unstyled mb-0" style="color: #A076F9; font-size: 11px; line-height: 1.6;">
                        <li>Gaming</li>
                        <li>Arquitectura</li>
                        <li>Edición de Video</li>
                        <li>Diseño gráfico</li>
                    </ul>
                </div>
            </div>

            <div class="col-md-4 mb-4 d-flex flex-column align-items-center justify-content-start">
                <div class="w-100 d-flex justify-content-center align-items-center position-relative mb-1" style="height: 220px; background-color: #F9F9F9; border: 1px dashed #ccc; border-radius: 8px;">
                    <span style="font-size: 12px; color: #888;">[ Aquí va el Gráfico de Araña ]</span>
                </div>
                
                <a href="#" id="linkForNerds" class="align-self-end fw-bold mb-2" style="font-size: 12px; color: #A076F9; text-decoration: underline;">For Nerds</a>
                
                <div id="contenedorEspecificaciones" class="w-100"></div>
            </div>
            
        </div>

        <div class="row mb-5">
            <div class="col-md-6 mb-4">
                <h3 class="fw-bold mb-3" style="font-size: 16px; color: #000000;">Video Review</h3>
                <div style="background-color: #E6E6E6; border-radius: 8px; height: 220px; display: flex; align-items: center; justify-content: center;">
                    <i class="bi bi-play-fill" style="font-size: 60px; color: #FFFFFF;"></i>
                </div>
            </div>
            
            <div class="col-md-6 mb-4">
                <div class="d-flex align-items-center mb-2">
                    <h3 class="fw-bold mb-0 me-2" style="font-size: 16px; color: #000000;">Reseña IA</h3>
                    <i class="bi bi-stars" style="font-size: 16px; color: #000000;"></i>
                </div>
                <p class="mb-3" style="font-size: 13px; color: #000000;">Reseña hecha por inteligencia artificial</p>
                <button class="btn" style="background: #FFFFFF; border: 1px solid #CCCCCC; font-size: 12px; padding: 6px 16px; border-radius: 4px; color: #000000;">Ver reseñas del sitio</button>
            </div>
        </div>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../scripts/detalles.js"></script>
</body>
</html>
