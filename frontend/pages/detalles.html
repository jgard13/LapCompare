<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/styles/detalles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>LapCompare</title>
</head>
<body>
    <header>
        <nav class="navbar LapCompare-titulo p-0">
            <div class="container-fluid p-3 d-flex justify-content-between align-items-center">
                <h1>LAP-COMPARE</h1>
                <div>
                    <button id="BtnIniciarSe" class="btnIniciar-Ses d-flex"> Iniciar Sesion </button>
                </div>
            </div>
        </nav>
    </header>

    <main class="container mt-4">
        
        <div class="mb-5">
            <a href="#" class="volver-catalogo">Volver al Catálogo</a>
        </div>

        <div class="row mb-5">
            
            <div class="col-md-4 mb-4">
                <div class="product-img-card">
                    <img id="imagenPrincipal" src="" alt="Laptop" class="img-fluid" style="max-height: 90%; object-fit: contain;" />
                    <div class="fav-icon" style="cursor: pointer;">
                        <i class="bi bi-heart text-secondary"></i>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-4 d-flex flex-column">
                <h2 id="nombreLaptop" class="product-name">Cargando...</h2>
                <p id="precioLaptop" class="product-price">Cargando...</p>
                
                <div class="d-flex flex-column gap-3 mb-5" style="max-width: 280px;">
                    <button class="btn btn-compare">Agregar a Comparación +</button>
                    <a id="btnIrAlSitio" href="#" target="_blank" rel="noreferrer" class="btn btn-buy">Ir al sitio de compra</a>
                    </div>

                <div class="info-section" style="max-width: 280px;">
                    <p class="fw-bold mb-2" style="font-size: 14px; color: #000000;">Ideal para:</p>
                    <ul class="list-unstyled mb-0" style="color: #A076F9; font-size: 14px; line-height: 1.8;">
                        <li>Gaming</li>
                        <li>Arquitectura</li>
                        <li>Edición de Video</li>
                        <li>Diseño gráfico</li>
                    </ul>
                </div>
            </div>

            <div class="col-md-4 mb-4 d-flex flex-column align-items-center justify-content-start">
                <div class="radar-chart-container mb-3 shadow-sm">
                    <canvas id="radarChart"></canvas>
                </div>
                <a href="#" id="linkForNerds" class="para-nerds align-self-end fw-bold mb-3">For Nerds</a>
                <div id="contenedorEspecificaciones" class="w-100"></div>
            </div>
            
        </div>

        <div class="row mb-5 py-4">
            <div class="col-md-6 mb-4">
                <h3 class="reseña-ia-title mb-4">Video Review</h3>
                <div id="videoContainer" class="video-container shadow-sm">
                    <i class="bi bi-play-fill play-icon"></i>
                </div>
            </div>
            
            <div class="col-md-6 mb-4 mt-2">
                <div class="d-flex align-items-center mb-3">
                    <h3 class="reseña-ia-title mb-0 me-3">Reseña IA</h3>
                    <i class="bi bi-stars" style="font-size: 24px; color: #A076F9;"></i>
                </div>
                <p class="reseña-ia-text mb-4">Reseña generada por inteligencia artificial experta en hardware para ayudarte a decidir.</p>
                <button class="btn btn-site-reviews">Ver reseñas del sitio original</button>
            </div>
        </div>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../scripts/detalles.js"></script>
</body>
</html>
