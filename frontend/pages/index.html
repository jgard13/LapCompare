<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/styles/index.css">
    <title>LapCompare</title>
</head>
<header>
    <nav class="navbar LapCompare-titulo p-0">
        <div class="container-fluid p-3 d-flex justify-content-between align-items-center">
            <h1>LAP-COMPARE</h1>
            <div>
                <button id="BtnIniciarSes" class="btnIniciar-Ses d-flex"> Iniciar Sesion </button>
            </div>
        </div>
    </nav>
</header>
    <body>
    <div class="container-fluid ContenedoresFyC">
    <div class="row vh-100">
        <div class="col-md-2 sticky-top p-4 Filtros">
    <h5 class="fw-bold mb-4">Filtros</h5>
    <div class="mb-4" id="Categorias" class="CategoriasD">
        <label class="fw-bold d-block mb-2">Categoría</label>
        <p class="text-secondary">hola</p>
        <p class="text-secondary">hola</p>
        <p class="text-secondary">hola</p>
        <p class="text-secondary">hola</p>
        <p class="text-secondary">hola</p>
        <p class="text-secondary">hola</p>
        <p class="text-secondary" id="VerMas" style="font-weight: bold; cursor: pointer;">Ver Más+</p>
    </div>
    <div class="slider-wrapper mb-4 position-relative">
    <label class="fw-bold d-block mb-3">Rango de precio</label>
    
    <div class="range-slider-container position-relative" style="height: 30px;">
        <div class="slider-track" style="position: absolute; top: 50%; left: 0; right: 0; height: 5px; background: #ddd; transform: translateY(-50%); border-radius: 5px;"></div>
        <div class="slider-range" id="slider-range" style="position: absolute; top: 50%; height: 5px; background: #A076F9; transform: translateY(-50%); border-radius: 5px; left: 0%; width: 100%;"></div>
        
        <input type="range" class="custom-slider min-slider" min="4500" max="60000" value="4500" step="500">
        <input type="range" class="custom-slider max-slider" min="4500" max="60000" value="60000" step="500">
    </div>

    <div class="d-flex justify-content-between mt-2 fw-bold text-muted">
        <span id="slider-min-value" class="text-white">$4500</span>
        <span id="slider-max-value" class="text-white">$60000</span>
    </div>
</div>
    <button class="btn btn-outline-light w-100 py-2" id="btn-comparar">
        Comparar
    </button>
    </div>
    <div class="col-10 Laptops">
        <div class="container-fluid py-4">
            <div class="LaptopsGrid" id="LaptopsGrid">
        </div>
    </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../scripts/index.js"></script>
</body>
</html>
