<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #FFFFFF;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            border: 1px solid #D2D2D2;
        }
        .header {
            background-color: #2D2D2D;
            padding: 20px;
            text-align: left;
        }
        .logo {
            color: #FFFFFF;
            font-weight: bold;
            font-size: 20px;
            letter-spacing: 2px;
        }
        .content {
            padding: 40px 20px;
            text-align: center;
            background-color: #FFFFFF;
        }
        .card {
            background-color: #F5F5F5;
            border-radius: 8px;
            padding: 30px;
            margin: 20px auto;
            max-width: 400px;
        }
        h1 {
            color: #000000;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #333333;
            font-size: 16px;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            background-color: #333333;
            color: #FFFFFF !important;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 18px;
            margin-top: 20px;
        }
        .footer-link {
            display: block;
            margin-top: 20px;
            color: #A076F9;
            font-size: 14px;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="logo">LAP-COMPARE</span>
        </div>

        <div class="content">
            <h1>¡Bienvenido a bordo!</h1>
            
            <div class="card">
                <p>Hola, nos alegra que te hayas unido a <strong>LAP-COMPARE</strong>. Ya puedes empezar a comparar y encontrar tu laptop ideal.</p>
                
                <a href="../Vistas/InicioDeSesion.html" class="btn">Iniciar Sesión</a>
                
            </div>
        </div>
    </div>
</body>
</html>
