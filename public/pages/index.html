<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/styles/index.css">
    <title>LapCompare</title>
</head>
<header>
    <nav class="navbar LapCompare-titulo p-0">
        <div class="container-fluid px-2 py-3 px-md-3 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <button class="btn btn-dark d-md-none me-2" id="btnToggleFiltros" style="border-radius: 8px;">
                    <i class="bi bi-list fs-3" style="color: #FFFFFF;"></i>
                </button>
                <h1 class="logo-horizon m-0">LAP-COMPARE</h1>
            </div>
            <div id="UserContainer" class="d-flex">
                <button id="BtnIniciarSes" class="btnIniciar-Ses d-flex align-items-center justify-content-center"> Iniciar Sesion </button>
            </div>
        </div>
    </nav>
</header>
    <body>
    <div class="overlay-filtros" id="overlayFiltros"></div>

    <div class="container-fluid ContenedoresFyC">
    <div class="row content-row">
        <div class="col-md-2 sticky-top p-4 Filtros" id="sidebarFiltros">

    
    <h5 class="fw-bold mb-4">Filtros</h5>
    <div class="mb-4" id="Categorias" class="CategoriasD">
        <label class="fw-bold d-block mb-2">Categoría</label>
            <!-- Categorías Dinámicas -->
            <div class="mb-2">
                <input class="form-check-input check-categoria" type="checkbox" value="Arquitectura" id="catArq">
                <label class="form-check-label" for="catArq">Arquitectura</label>
            </div>
            <div class="mb-2">
                <input class="form-check-input check-categoria" type="checkbox" value="Gaming" id="catGame">
                <label class="form-check-label" for="catGame">Gaming</label>
            </div>
            <div class="mb-2">
                <input class="form-check-input check-categoria" type="checkbox" value="Programación" id="catProg">
                <label class="form-check-label" for="catProg">Programación</label>
            </div>
            <div class="mb-2">
                <input class="form-check-input check-categoria" type="checkbox" value="Diseño 3D" id="cat3D">
                <label class="form-check-label" for="cat3D">Diseño 3D</label>
            </div>
            <div class="mb-2">
                <input class="form-check-input check-categoria" type="checkbox" value="Renderizado" id="catRend">
                <label class="form-check-label" for="catRend">Renderizado</label>
            </div>
            <div class="mb-2">
                <input class="form-check-input check-categoria" type="checkbox" value="Edición" id="catEdit">
                <label class="form-check-label" for="catEdit">Edición</label>
            </div>
            <div class="mb-2">
                <input class="form-check-input check-categoria" type="checkbox" value="Oficina" id="catOfi">
                <label class="form-check-label" for="catOfi">Oficina</label>
            </div>
            <div class="mb-2">
                <input class="form-check-input check-categoria" type="checkbox" value="Escuela" id="catEsc">
                <label class="form-check-label" for="catEsc">Escuela</label>
            </div>
    </div>

    <div class="mb-4">
        <label class="fw-bold d-block mb-2">Modo de Requisitos</label>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="toggleModo" checked>
          <label class="form-check-label text-white" for="toggleModo" id="labelModo">Óptimo</label>
        </div>
    </div>
    <div class="slider-wrapper mb-4 position-relative">
    <label class="fw-bold d-block mb-3">Rango de precio</label>
    
    <div class="range-slider-container position-relative" style="height: 30px;">
        <div class="slider-track" style="position: absolute; top: 50%; left: 0; right: 0; height: 5px; background: #ddd; transform: translateY(-50%); border-radius: 5px;"></div>
        <div class="slider-range" id="slider-range" style="position: absolute; top: 50%; height: 5px; background: #A076F9; transform: translateY(-50%); border-radius: 5px; left: 0%; width: 100%;"></div>
        
        <input type="range" class="custom-slider min-slider" min="4500" max="60000" value="4500" step="500">
        <input type="range" class="custom-slider max-slider" min="4500" max="60000" value="60000" step="500">
    </div>

    <div class="d-flex justify-content-between mt-2 fw-bold text-muted">
        <span id="slider-min-value" class="text-white">$4500</span>
        <span id="slider-max-value" class="text-white">$60000</span>
    </div>
</div>
    <button class="btn btn-outline-light w-100 py-2" id="btn-comparar">
        Comparar
    </button>
    </div>
    <div class="col-12 col-md-10 Laptops">
        <div class="container-fluid py-4">
            <div class="LaptopsGrid" id="LaptopsGrid">
        </div>
    </div>
</div>
    <!-- Modal Límite Comparación -->
    <div class="modal fade" id="modalLimiteComparacion" tabindex="-1" aria-labelledby="modalLimiteComparacionLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-white" style="background-color: #2D2D2D; border: 2px solid #A076F9; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="modalLimiteComparacionLabel" style="color: #FFFFFF; font-family: 'Horizon', sans-serif; font-size: 20px;">
                        <i class="bi bi-exclamation-triangle-fill me-2" style="color: #A076F9;"></i>LÍMITE ALCANZADO
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body py-3">
                    <p class="mb-2" style="font-size: 1.05rem;">Has alcanzado el límite máximo de <strong style="color: #A076F9;">4 dispositivos</strong> en comparación.</p>
                    <p class="text-white-50 mb-4" style="font-size: 0.9rem;">Para agregar el nuevo dispositivo, selecciona cuál de la lista actual deseas reemplazar:</p>
                    
                    <div class="mb-2">
                        <label for="selectLaptopARemover" class="form-label fw-bold" style="color: #A076F9; font-size: 0.9rem;">DISPOSITIVO A ELIMINAR:</label>
                        <select id="selectLaptopARemover" class="form-select text-white" style="background-color: #3D3D3D; border: 1px solid #555555; border-radius: 8px; padding: 12px 35px 12px 15px; font-size: 0.95rem;">
                            <!-- Opciones cargadas dinámicamente -->
                        </select>
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-outline-light border-0" data-bs-dismiss="modal" style="border-radius: 8px; font-weight: bold; font-size: 0.9rem; padding: 8px 16px; background-color: #3D3D3D;">Cancelar</button>
                    <button type="button" id="btnConfirmarReemplazo" class="btn text-white fw-bold btnIniciar-Ses" style="border-radius: 8px; font-size: 0.9rem; padding: 8px 16px;">Confirmar y Reemplazar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../scripts/toast.js"></script>
    <script src="../scripts/index.js"></script>
</body>
</html>
