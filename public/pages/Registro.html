<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../styles/InicioDeSesion.css">
    <title>LapCompare - Registro</title>

</head>
<body>
    
    <nav class="navbar LapCompare-titulo p-0">
        <div class="container-fluid p-3">
            <h1>LAP-COMPARE</h1>
        </div>
    </nav>

    <div class="container d-flex align-items-center justify-content-center min-vh-100">
        <div class="contenedor-inicio">
            <h3>Crear Cuenta</h3>
            <div class="contenedor-forms">
                <form>
                    <div class="mb-3">
                        <label for="regUsuario" class="form-label">Nombre de usuario</label>
                        <input type="text" id="regUsuario" class="form-control" placeholder="Usuario">
                    </div>

                    <div class="mb-3">
                        <label for="regEmail" class="form-label">Correo Electrónico</label>
                        <input type="email" id="regEmail" class="form-control" placeholder="ejemplo@correo.com">
                    </div>

                    <div class="mb-2">
                        <label for="regPassword" class="form-label">Contraseña</label>
                        <div class="password-container">
                            <input type="password" id="regPassword" class="form-control" placeholder="Contraseña">
                            <span class="toggle-password">
                                <i class="bi bi-eye-slash" id="toggleIcon"></i>
                            </span>
                        </div>
                        <ul class="lista-requisitos">
                            <li>• Maximo 12 caracteres</li>
                            <li>• Minimo 1 caracter especial</li>
                            <li>• Una mayúscula y un número</li>
                        </ul>
                    </div>

                    <div class="row d-flex align-items-center justify-content-center">
                        <button id="Registro" class="btn Boton-Inicio" type="button">Registrarse</button>
                    </div>

                    <div class="text-center mt-4">
                        <a href="InicioDeSesion.html" class="enlace-registro">¿Ya tienes cuenta? Inicia Sesión</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../scripts/Registro.js"></script>
</body>
</html>
