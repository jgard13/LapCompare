<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../styles/usuario.css">
    <title>LapCompare - Perfil</title>
</head>
<body>
    <nav class="navbar LapCompare-titulo p-0">
        <div class="container-fluid p-3 d-flex justify-content-between align-items-center">
            
            <div class="d-flex align-items-center gap-2">
                <a href="javascript:history.back()" class="text-white text-decoration-none fs-4" title="Regresar a la vista anterior">
                    <i class="bi bi-arrow-left-circle-fill"></i>
                </a>
                <h1 class="m-0">LAP-COMPARE</h1>
            </div>

            <div class="d-flex align-items-center">
            </div>
        </div>
    </nav>
    <main class="container py-3 d-flex flex-column" style="height: calc(100vh - 80px);"> 
    
    <div class="row mb-3">
        <div class="col-12">
            <div class="card card-custom p-3 m-0"> 
                <div class="row align-items-center"> 
                    <div class="col-auto"> 
                        <div class="avatar m-0" id="avatarIniciales">US</div> 
                    </div>
                    <div class="col text-start ps-3"> 
                        <h2 class="user-name mb-1" id="cardNombreUsuario">Nombre de Usuario</h2>
                        <p class="user-email mb-0" id="cardCorreoUsuario">usuario@correo.com</p>
                    </div>
                    <div class="col-auto text-end"> 
                        <button id="BtnCerrarSes" class="btn-logout"> Cerrar Sesión </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row justify-content-start mb-3">
        <div class="col-12  d-flex flex-column">
            <div class="card card-custom h-70 d-flex flex-column m-0 p-1">
                <h2 class="section-title mb-2">Favoritos</h2>
                <div class="content-container d-flex align-items-center justify-content-center text-muted flex-grow-1 m-0 " id="contenedorFavoritos">
                    Tus laptops favoritas aparecerán aquí.
                </div>
                <div class="text-end mt-0">
                    <a class="link-more" id="linkVerMasFav">Ver más (x restantes)</a>
                </div>
            </div>
        </div>
    </div>

    <div class="row justify-content-start ">
        <div class="col-12 d-flex flex-column">
            <div class="card card-custom h-70 d-flex flex-column m-0 p-1">
                <h2 class="section-title mb-1">Vistos Recientemente</h2>
                <p class="info-legend mb-2">Los datos se conservan por 30 días.</p>
                <div class="content-container d-flex align-items-center justify-content-center text-muted flex-grow-1 m-0" id="contenedorVistos">
                    Tu historial de laptops aparecerá aquí.
                </div>
                <div class="text-end mt-0">
                </div>
            </div>
        </div>
    </div>

</main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../scripts/Usuario.js"></script>
</body>
</html>
