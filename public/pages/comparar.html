<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparación - LapCompare</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <link rel="stylesheet" href="/styles/comparacion.css">
</head>
<body>

    <header class="LapCompare-titulo">
        <nav class="navbar LapCompare-titulo p-0">
        <div class="container-fluid p-3 d-flex justify-content-between align-items-center">
            
            <div class="d-flex align-items-center gap-2">
                <a href="javascript:history.back()" class="text-white text-decoration-none fs-4" title="Regresar a la vista anterior">
                    <i class="bi bi-arrow-left-circle-fill"></i>
                </a>
                <h1 class="logo-horizon m-0">LAP-COMPARE</h1>
            </div>

            <div id="UserContainer" class="d-flex">
                <button id="BtnIniciarSes" class="btnIniciar-Ses d-flex align-items-center justify-content-center"> Iniciar Sesion </button>
            </div>
        </div>
    </nav></header>

    <main class="container-fluid px-5 py-5">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
            <h2 class="titulo-principal">Comparación de dispositivos</h2>
            
            <div class="d-flex align-items-center">
                <label for="filtroContexto" class="me-2 fw-bold text-muted">Filtrar por:</label>
                <select id="filtroContexto" class="form-select btn-selector-custom" style="width: auto;">
                    <option value="promedio" selected>General (Promedio)</option>
                    <option value="precio">Mejor Precio</option>
                    <option value="procesamiento">Mayor Procesamiento (CPU)</option>
                    <option value="multitarea">Mejor Multitarea (RAM)</option>
                    <option value="graficos">Mejores Gráficos (GPU)</option>
                    <option value="espacio">Más Espacio (Almacenamiento)</option>
                </select>
            </div>
        </div>

        <div id="contenedor-tarjetas" class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-3 mb-5">
            </div>

        <section class="visual-section mt-5 text-center">
            <h3 class="titulo-secundario mb-4 text-start">Comparación visual</h3>
            <div class="radar-container-large">
                <canvas id="radarChart"></canvas>
            </div>
        </section>

        <div class="contenedor-recomendacion mt-5">
            <p id="texto-recomendacion"></p>
        </div>

        <div class="text-center mt-4">
            <a href="/" class="btn btn-link text-decoration-none" style="color: #A076F9;">
                <i class="bi bi-arrow-left"></i> Volver al catálogo
            </a>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/scripts/comparar.js"></script>
</body>
</html>
